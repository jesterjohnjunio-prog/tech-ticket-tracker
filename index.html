<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Concerns - New Tickets Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f5f7fa; color: #333; padding: 20px; }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(to right, #f87171, #ef4444);
            color: white;
            padding: 25px 30px;
        }
        
        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 10px;
            min-width: 150px;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .controls {
            padding: 20px 30px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        #searchInput {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
        }
        
        .refresh-btn {
            background: #f87171;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .refresh-btn:hover {
            background: #ef4444;
        }
        
        .table-container {
            padding: 20px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        
        th {
            background: #f1f5f9;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #475569;
            border-bottom: 2px solid #e2e8f0;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: top;
        }
        
        tr:hover {
            background: #f8fafc;
        }
        
        .ticket-id {
            background: #f7fafc;
            padding: 5px 10px;
            border-radius: 5px;
            font-family: monospace;
            font-weight: bold;
            color: #ef4444;
        }
        
        .problem-tag {
            background: #fee2e2;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 5px;
            color: #dc2626;
        }
        
        .description {
            color: #64748b;
            font-size: 0.9rem;
            line-height: 1.4;
            max-width: 300px;
        }
        
        .mis-personnel {
            background: #fee2e2;
            color: #dc2626;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }
        
        .error {
            text-align: center;
            padding: 60px 20px;
            color: #e53e3e;
        }
        
        .error button {
            margin-top: 20px;
            background: #f87171;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-ticket-alt"></i> Technical Concerns - New Tickets Tracker</h1>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalTickets">0</div>
                    <div>New Tickets</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="todayTickets">0</div>
                    <div>Today's Tickets</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="uniquePersonnel">0</div>
                    <div>MIS Personnel</div>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search new tickets...">
            <button id="refreshBtn" class="refresh-btn">
                <i class="fas fa-redo-alt"></i> Refresh
            </button>
        </div>
        
        <div class="table-container">
            <div id="loading" class="loading">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p>Loading new tickets...</p>
            </div>
            
            <div id="error" class="error" style="display: none;">
                <i class="fas fa-exclamation-triangle fa-2x"></i>
                <h3>Unable to load tickets</h3>
                <p id="errorMessage">Please check your connection and try again.</p>
                <button onclick="loadTickets()">Try Again</button>
            </div>
            
            <table id="ticketsTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Ticket ID</th>
                        <th>Date</th>
                        <th>Talent Name</th>
                        <th>Assistance Needed</th>
                        <th>Description</th>
                        <th>Preferred MIS Personnel</th>
                    </tr>
                </thead>
                <tbody id="ticketsBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadTickets() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const table = document.getElementById('ticketsTable');
            
            loading.style.display = 'block';
            error.style.display = 'none';
            table.style.display = 'none';
            
            try {
                // Use CSV export from the Google Sheet
                const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vThsYnoHcRAZyAb4Jwa4Z8xLuSo4KUAlW32rq36auU65r_19qlXdaGd69hUj8eyQsK0XHC2F2ks7gIR/pub?gid=1249957220&single=true&output=csv';
                
                console.log('Loading from Google Sheet:', csvUrl);
                
                const response = await fetch(csvUrl);
                if (!response.ok) {
                    throw new Error(`Failed to fetch data: ${response.status} ${response.statusText}`);
                }
                
                const csvText = await response.text();
                
                // Parse CSV - with improved CSV parsing for Google Sheets format
                const rows = parseCSV(csvText);
                const tickets = [];
                
                console.log('Total rows found:', rows.length);
                
                // Process each row (skip header row)
                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i];
                    
                    // Check if we have enough columns
                    if (cols.length >= 6) {
                        const ticket = {
                            'Ticket ID': cols[0] || '', // Column A
                            'Date': cols[1] || '', // Column B
                            'Talent Name': cols[2] || '', // Column C
                            'Assistance Needed': cols[3] || '', // Column D
                            'Description': cols[4] || '', // Column E
                            'Preferred MIS Personnel': cols[5] || 'Unassigned' // Column F
                        };
                        
                        // Only add if we have at least some data
                        if (ticket['Ticket ID'].trim() !== '' || ticket['Talent Name'].trim() !== '') {
                            tickets.push(ticket);
                        }
                    } else if (cols.length > 0) {
                        console.log(`Row ${i} has only ${cols.length} columns:`, cols);
                    }
                }
                
                console.log('Loaded', tickets.length, 'tickets from Google Sheet');
                
                if (tickets.length > 0) {
                    displayTickets(tickets);
                    updateStats(tickets);
                } else {
                    // Test with sample data if no tickets found
                    console.log('No tickets loaded. Testing with sample data...');
                    const sampleTickets = createSampleTickets();
                    displayTickets(sampleTickets);
                    updateStats(sampleTickets);
                }
                
            } catch (err) {
                console.error('Error:', err);
                document.getElementById('errorMessage').textContent = `Error: ${err.message}. Please ensure the Google Sheet is published to web.`;
                error.style.display = 'block';
                loading.style.display = 'none';
            }
        }
        
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentValue = '';
            let inQuotes = false;
            
            for (let i = 0; i < csvText.length; i++) {
                const char = csvText[i];
                const nextChar = csvText[i + 1] || '';
                
                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        // Escaped quote inside quotes
                        currentValue += '"';
                        i++; // Skip next char
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    // End of value
                    currentRow.push(currentValue);
                    currentValue = '';
                } else if (char === '\n' && !inQuotes) {
                    // End of row
                    currentRow.push(currentValue);
                    rows.push(currentRow);
                    currentRow = [];
                    currentValue = '';
                } else if (char === '\r' && nextChar === '\n' && !inQuotes) {
                    // Handle Windows line endings
                    currentRow.push(currentValue);
                    rows.push(currentRow);
                    currentRow = [];
                    currentValue = '';
                    i++; // Skip the \n
                } else {
                    currentValue += char;
                }
            }
            
            // Add the last row if there's any data
            if (currentValue !== '' || currentRow.length > 0) {
                currentRow.push(currentValue);
                rows.push(currentRow);
            }
            
            return rows;
        }
        
        function createSampleTickets() {
            return [
                {
                    'Ticket ID': 'TC-20240115-001',
                    'Date': '2024-01-15 09:30:00',
                    'Talent Name': 'John Smith',
                    'Assistance Needed': 'Software Installation',
                    'Description': 'Need Adobe Creative Cloud installed on workstation',
                    'Preferred MIS Personnel': 'Alex Johnson'
                },
                {
                    'Ticket ID': 'TC-20240115-002',
                    'Date': '2024-01-15 10:15:00',
                    'Talent Name': 'Maria Garcia',
                    'Assistance Needed': 'Network Connectivity',
                    'Description': 'Cannot connect to corporate WiFi',
                    'Preferred MIS Personnel': 'Sam Wilson'
                },
                {
                    'Ticket ID': 'TC-20240115-003',
                    'Date': '2024-01-15 11:45:00',
                    'Talent Name': 'David Chen',
                    'Assistance Needed': 'Hardware Issue',
                    'Description': 'Laptop keyboard not functioning properly',
                    'Preferred MIS Personnel': 'Taylor Kim'
                }
            ];
        }
        
        function displayTickets(tickets) {
            const tbody = document.getElementById('ticketsBody');
            const loading = document.getElementById('loading');
            const table = document.getElementById('ticketsTable');
            
            tbody.innerHTML = '';
            
            tickets.forEach(ticket => {
                const row = document.createElement('tr');
                
                // Format date - handle various date formats
                let date = ticket.Date;
                try {
                    const dateObj = new Date(ticket.Date);
                    if (!isNaN(dateObj.getTime())) {
                        date = dateObj.toLocaleDateString('en-US', {
                            year: 'numeric',
                            month: 'short',
                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                    }
                } catch (e) {
                    // If date parsing fails, use original value
                }
                
                row.innerHTML = `
                    <td><span class="ticket-id">${ticket['Ticket ID'] || 'N/A'}</span></td>
                    <td>${date}</td>
                    <td><strong>${ticket['Talent Name'] || 'N/A'}</strong></td>
                    <td>
                        <div class="problem-tag">${ticket['Assistance Needed'] || 'Not specified'}</div>
                    </td>
                    <td><div class="description">${ticket['Description'] || 'No description'}</div></td>
                    <td>
                        <span class="mis-personnel">
                            <i class="fas fa-user"></i>
                            ${ticket['Preferred MIS Personnel'] || 'Unassigned'}
                        </span>
                    </td>
                `;
                
                tbody.appendChild(row);
            });
            
            loading.style.display = 'none';
            table.style.display = 'table';
        }
        
        function updateStats(tickets) {
            document.getElementById('totalTickets').textContent = tickets.length;
            
            const today = new Date().toISOString().split('T')[0];
            const todayTickets = tickets.filter(t => {
                try {
                    const ticketDate = new Date(t.Date).toISOString().split('T')[0];
                    return ticketDate === today;
                } catch (e) {
                    return false;
                }
            }).length;
            document.getElementById('todayTickets').textContent = todayTickets;
            
            const personnel = [...new Set(tickets.map(t => t['Preferred MIS Personnel']).filter(Boolean))];
            document.getElementById('uniquePersonnel').textContent = personnel.length;
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('refreshBtn').addEventListener('click', loadTickets);
            
            // Setup search
            document.getElementById('searchInput').addEventListener('input', function(e) {
                const search = e.target.value.toLowerCase();
                const rows = document.querySelectorAll('#ticketsBody tr');
                
                rows.forEach(row => {
                    const text = row.textContent.toLowerCase();
                    row.style.display = text.includes(search) ? '' : 'none';
                });
            });
            
            // Load tickets
            loadTickets();
            
            // Auto-refresh every 5 minutes
            setInterval(loadTickets, 5 * 60 * 1000);
        });
    </script>
</body>
</html>
